<html lang="tr" data-theme="system"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>ByteAI</title>
<script>if(!location.pathname.endsWith('/')&&!/\.html?$/i.test(location.pathname)&&location.protocol!=='file:')location.replace(location.pathname+'/'+location.search+location.hash);try{var t=localStorage.getItem('byteai.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f2f1ee;--fg:#101014;--mut:rgba(16,16,20,.62);--faint:rgba(16,16,20,.42);--line:rgba(16,16,20,.14);--hover:rgba(16,16,20,.05);--btn:#101014;--btnfg:#f2f1ee;--acc:#1a5bc4;--accbg:rgba(26,91,196,.07);--pop:#fbfaf8;--sunken:rgba(16,16,20,.04);--ok:#1f7a4d;--err:#b3261e;--app:#6b4cd6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--fg:#f2f1ee;--mut:rgba(242,241,238,.62);--faint:rgba(242,241,238,.42);--line:rgba(242,241,238,.13);--hover:rgba(242,241,238,.05);--btn:#f2f1ee;--btnfg:#121316;--acc:#7fb0ff;--accbg:rgba(127,176,255,.09);--pop:#1b1c20;--sunken:rgba(242,241,238,.04);--ok:#5fd39a;--err:#ff8a80;--app:#a48cff}}
:root[data-theme=dark]{--bg:#121316;--fg:#f2f1ee;--mut:rgba(242,241,238,.62);--faint:rgba(242,241,238,.42);--line:rgba(242,241,238,.13);--hover:rgba(242,241,238,.05);--btn:#f2f1ee;--btnfg:#121316;--acc:#7fb0ff;--accbg:rgba(127,176,255,.09);--pop:#1b1c20;--sunken:rgba(242,241,238,.04);--ok:#5fd39a;--err:#ff8a80;--app:#a48cff}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.hud,.suite,.btn,.lbl,.pill,.lang{font-family:ui-monospace,"Geist Mono",SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
header{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:48px;flex:none}
.brand{display:flex;align-items:center;padding:0 20px 0 10px;border-right:1px solid var(--line);font:900 20px/1 system-ui,"Segoe UI",sans-serif;letter-spacing:.06em;color:var(--fg);text-decoration:none}
.suite{display:flex;align-items:center;padding:0 16px;font-size:11px;color:var(--mut)}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 8px 4px}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;padding:0}
.ib:hover{background:var(--fg);color:var(--bg)}.ib svg{width:16px;height:16px}
.lang{width:auto;padding:0 10px;font-size:11px;font-weight:600}
.hud{font-size:10.5px;color:var(--faint)}
main{padding:8px;flex:1;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:0;margin-top:clamp(8px,6vh,64px)}
.card{position:relative;border:1px solid var(--line);background:var(--bg)}
.card::before{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--app);transition:width .3s linear}
.card:hover::before,.card:focus-within::before{width:100%}
.ct{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ct .hud{color:var(--app)}
.ct .r{margin-left:auto}
.cb{padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.tg{margin:0;color:var(--mut);font-size:15px}
.lbl{font-size:10px;color:var(--faint);display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{height:40px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:0 12px;font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-width:0}
input[type=text]:focus{outline:2px solid var(--app);outline-offset:-1px}
.fld{display:flex;flex-direction:column;min-width:0}#host{width:100%}#port{width:110px;text-align:center}
.chk{display:flex;align-items:center;gap:8px;color:var(--mut);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--app);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;font-size:11px;font-weight:600;background:var(--btn);color:var(--btnfg);text-decoration:none;border:1px solid var(--btn);cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.86}.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}.btn.sec:hover{background:var(--hover);opacity:1}
.btn.go{flex:1 1 160px}
.msg{min-height:20px;margin:0;color:var(--mut)}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.saved{border:1px solid var(--line);background:var(--sunken);padding:14px;display:flex;flex-direction:column;gap:12px}
.saved code{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.bar{height:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--app)}
footer{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);flex:none}
.disc{margin-right:auto;font-size:11px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.card::before{transition:none!important}}
@media (max-width:640px){.brand{font-size:17px}.suite{font-size:9.5px;padding:0 10px;min-width:0;line-height:1.35;letter-spacing:.08em}#port{width:88px}}
</style></head><body>
<header><a class="brand" href="./">ByteAI</a><span class="suite" data-i18n="suite"></span></header>
<div class="toolbar">
<button id="theme" class="ib" type="button"></button>
<button id="lang" class="ib lang" type="button"></button>
</div>
<main><div class="wrap">
<section class="card">
<div class="ct"><span class="hud" lang="en">ByteAI</span></div>
<div class="cb">
<p class="tg" data-i18n="tag"></p>

<div id="savedBox" class="saved" hidden>
<div><span class="lbl" data-i18n="savedServer"></span><code id="savedUrl"></code></div>
<div id="autoBar" class="bar" hidden><i id="autoFill"></i></div>
<p id="autoMsg" class="msg" hidden></p>
<div class="row">
<button id="openSaved" class="btn go" type="button" data-i18n="open"></button>
<button id="cancelAuto" class="btn sec" type="button" data-i18n="cancel" hidden></button>
<button id="change" class="btn sec" type="button" data-i18n="change"></button>
<button id="forget" class="btn sec" type="button" data-i18n="forget"></button>
</div>
</div>

<form id="form" autocomplete="off" novalidate>
<div class="row">
<div class="fld" style="flex:1 1 160px"><label class="lbl" for="host" data-i18n-html="hostLabel"></label><input id="host" type="text" inputmode="url" spellcheck="false" autocapitalize="off"></div>
<div class="fld" style="flex:none"><label class="lbl" for="port" lang="en">Port</label><input id="port" type="text" inputmode="numeric" maxlength="5" spellcheck="false" data-i18n-title="portTitle"></div>
</div>
<p id="msg" class="msg"></p>
<div class="row" style="align-items:center;justify-content:space-between">
<label class="chk"><input id="remember" type="checkbox" checked><span data-i18n="remember"></span></label>
<button class="btn go" type="submit" data-i18n="connect" style="flex:0 1 220px"></button>
</div>
</form>
</div>
</section>

</div></main>
<footer><span class="disc" data-i18n="disc"></span><a class="hud" lang="en" href="https://github.com/egegurkan/ByteAI" target="_blank" rel="noopener noreferrer">GitHub</a></footer>

<script>
(function(){
'use strict';
var K={server:'byteai.server',auto:'byteai.auto',lang:'byteai.lang',theme:'byteai.theme'};
var AUTO_SECONDS=3;
var T={
tr:{suite:'Özel yapay zeka çalışma alanı',
tag:'Kendi bilgisayarındaki yapay zekaya her cihazdan bağlan.',savedServer:'Kayıtlı sunucu',open:'Aç',cancel:'İptal',change:'Değiştir',forget:'Unut',
hostLabel:'<span lang="en">Address</span> adresi',portTitle:'Boş bırakılırsa 3000 kullanılır',remember:'Hatırla ve sonraki girişlerde otomatik bağlan',connect:'Bağlan',
autoIn:function(n){return n+' sn içinde bağlanılıyor...'},redirecting:'Yönlendiriliyor...',
eEmpty:'Adresi yazın.',eInvalid:'Geçerli bir adres değil.',
eShort:'Tam adresi yazın (".ts.net" ile biten). Kısa makine adı HTTPS ile çalışmaz.',eTs:'Adres ".ts.net" ile bitmeli. Yönetim panelindeki Machines bölümünden makine adının tam hâlini kullanın.',ePort:'Port 1-65535 arasında olmalı.',
disc:'Bu sayfa yalnızca yönlendirir; veri toplamaz. Sohbetler kendi bilgisayarında kalır.',
themeT:{system:'Tema: sistem',light:'Tema: açık',dark:'Tema: koyu'}},
en:{suite:'Private AI workspace',
tag:'Reach the AI on your own computer from any device.',savedServer:'Saved server',open:'Open',cancel:'Cancel',change:'Change',forget:'Forget',
hostLabel:'<span lang="en">Address</span> address',portTitle:'Leave empty to use 3000',remember:'Remember and connect automatically next time',connect:'Connect',
autoIn:function(n){return 'Connecting in '+n+' s...'},redirecting:'Redirecting...',
eEmpty:'Enter your address.',eInvalid:'This is not a valid address.',
eShort:'Enter the full name (ending in ".ts.net"). A short machine name does not work over HTTPS.',eTs:'The address must end in ".ts.net". Use the full machine name from the admin console (Machines).',ePort:'Port must be between 1 and 65535.',
disc:'This page only redirects and collects no data. Your chats stay on your own computer.',
themeT:{system:'Theme: system',light:'Theme: light',dark:'Theme: dark'}}};

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
var $=function(id){return document.getElementById(id)};
var lang=ls(K.lang)||((navigator.language||'tr').toLowerCase().indexOf('tr')===0?'tr':'en');
function t(k){return T[lang][k]}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i18n-html'))});
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){el.title=t(el.getAttribute('data-i18n-title'))});
  $('lang').textContent=lang==='tr'?'EN':'TR';
  $('lang').title=lang==='tr'?'English':'Türkçe';
  drawTheme();
}

var icons={system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function curTheme(){var v=document.documentElement.dataset.theme;return v==='light'||v==='dark'?v:'system'}
function drawTheme(){var v=curTheme();$('theme').innerHTML=icons[v];$('theme').title=t('themeT')[v]}
$('theme').onclick=function(){var order=['system','light','dark'];var n=order[(order.indexOf(curTheme())+1)%3];document.documentElement.dataset.theme=n;ls(K.theme,n==='system'?null:n);drawTheme()};
$('lang').onclick=function(){lang=lang==='tr'?'en':'tr';ls(K.lang,lang);applyLang();if(autoTimer)tick(true)};

// Girdiyi https://<host>.ts.net:<port>/ bicimine cevirir. Kabul: tam ad, https://... URL'si, :port ekli ad.
function build(raw,portRaw){
  var s=(raw||'').trim();
  if(!s)return{err:'eEmpty'};
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s))s='https://'+s;
  var u;try{u=new URL(s)}catch(e){return{err:'eInvalid'}}
  var host=u.hostname.toLowerCase().replace(/\.$/,'');
  if(!host||/[^a-z0-9.-]/.test(host))return{err:'eInvalid'};
  if(host.indexOf('.')<0)return{err:'eShort'};
  if(!/\.ts\.net$/.test(host))return{err:'eTs'};
  var port=u.port||String(portRaw||'').trim()||'3000';
  if(!/^\d{1,5}$/.test(port)||+port<1||+port>65535)return{err:'ePort'};
  return{url:'https://'+host+(port==='443'?'':':'+port)+'/',host:host,port:port};
}
function go(url,replace){
  $('msg').className='msg ok';$('msg').textContent=t('redirecting');
  if(replace)location.replace(url);else location.href=url;
}

var autoTimer=null,autoLeft=0;
function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}$('autoBar').hidden=true;$('autoMsg').hidden=true;$('cancelAuto').hidden=true}
function tick(redrawOnly){
  $('autoMsg').textContent=t('autoIn')(autoLeft);
  $('autoFill').style.width=((AUTO_SECONDS-autoLeft)/AUTO_SECONDS*100)+'%';
}
function startAuto(url){
  autoLeft=AUTO_SECONDS;$('autoBar').hidden=false;$('autoMsg').hidden=false;$('cancelAuto').hidden=false;tick();
  $('autoFill').style.transition='width 1s linear';
  autoTimer=setInterval(function(){autoLeft--;tick();if(autoLeft<=0){stopAuto();ss('byteai.redirected','1');go(url,true)}},1000);
}

function showSaved(){
  var saved=ls(K.server);
  if(!saved){$('savedBox').hidden=true;$('form').hidden=false;return null}
  $('savedUrl').textContent=saved;$('savedBox').hidden=false;$('form').hidden=true;
  return saved;
}
$('openSaved').onclick=function(){stopAuto();var s=ls(K.server);if(s){ss('byteai.redirected','1');go(s,false)}};
$('cancelAuto').onclick=stopAuto;
$('change').onclick=function(){stopAuto();var s=ls(K.server)||'';try{var u=new URL(s);$('host').value=u.hostname;$('port').value=(u.port&&u.port!=='3000')?u.port:(u.port?'':'443')}catch(e){}
  $('savedBox').hidden=true;$('form').hidden=false;$('host').focus()};
$('forget').onclick=function(){stopAuto();ls(K.server,null);ls(K.auto,null);$('host').value='';$('port').value='';showSaved();$('host').focus()};

$('form').onsubmit=function(e){
  e.preventDefault();
  var r=build($('host').value,$('port').value);
  if(r.err){$('msg').className='msg err';$('msg').textContent=t(r.err);$('host').focus();return}
  if($('remember').checked){ls(K.server,r.url);ls(K.auto,'1')}else{ls(K.server,null);ls(K.auto,null)}
  ss('byteai.redirected','1');
  go(r.url,false);
};
['host','port'].forEach(function(id){$(id).addEventListener('input',function(){$('msg').textContent='';$('msg').className='msg'})});

// #ts.net-adresi ile acilirsa (yer imi): alanlar doldurulur. Hash GitHub'a gonderilmez.
function fromHash(){
  var h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(!h)return;
  var r=build(h,'');
  if(!r.err){$('host').value=r.host;$('port').value=r.port!=='3000'?r.port:''}
}

applyLang();
fromHash();
var saved=showSaved();
// Otomatik baglanti: hatirlaniyorsa ve bu sekmede zaten yonlendirilmediyse (geri tusu dongusu olmasin).
if(saved&&ls(K.auto)==='1'&&ss('byteai.redirected')!=='1'&&!location.hash)startAuto(saved);
})();
</script>
</body></html>
